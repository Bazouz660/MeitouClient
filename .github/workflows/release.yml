# Manual release, or a nightly pre-release each day there are game changes since the last v* tag: builds the game and the world viewer (meitou-viewer), self-contained, for Windows, Linux and macOS
# (tools/scripts/package-release.ps1; the Windows zip with NVIDIA DLSS/Streamline and AMD FidelityFX next to the exes), tags the commit
# v<version> and publishes a GitHub release with one Meitou-<version>-<rid>.zip per runtime (docs/launcher.md), never marked Latest
# (that is the newest full launcher release, launcher-release.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, e.g. 0.1.0 (empty: 0.0.<run number>)"
        required: false
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true
      nightly:
        description: "Nightly build (version and notes made up, no changelog section needed); skipped without changes"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC

permissions:
  contents: write

jobs:
  # Checks the version and its changelog section, runs the quick tests; nothing is built or released if this fails.
  # A nightly with no game changes since the newest v* tag (nightly or full) stops here without failing.
  version:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      nightly: ${{ steps.version.outputs.nightly }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:NIGHTLY -eq 'true') {
            # Skipped when nothing the game zips are built from changed since the newest game tag, nightly or full.
            $last = git tag -l "v[0-9]*" --sort=-creatordate | Select-Object -First 1
            if ($last) {
              git diff --quiet $last HEAD -- . ':!news' ':!site' ':!launcher' ':!.github/workflows/site-image.yml' ':!.github/workflows/launcher-release.yml'
              if ($LASTEXITCODE -eq 0) { "No game changes since $last; no nightly." >> $env:GITHUB_STEP_SUMMARY; "nightly=skip" >> $env:GITHUB_OUTPUT; exit 0 }
            }
            # <next patch of the newest full release>-nightly.<UTC date>: after that release, before the next one (semver).
            $full = git tag -l "v[0-9]*" --sort=-v:refname | Where-Object { $_ -notmatch '-' } | Select-Object -First 1
            $n = if ($full) { [Version]$full.TrimStart('v') } else { [Version]'0.0.0' }
            $v = "$($n.Major).$($n.Minor).$($n.Build + 1)-nightly.$((Get-Date).ToUniversalTime().ToString('yyyyMMdd'))"
            if (git tag -l "v$v") { $v += ".$env:RUN_NUMBER" }
            # Every commit since that tag: GitHub's generated notes list only merged pull requests, and most work is committed to master directly.
            $range = if ($last) { "$last..HEAD" } else { 'HEAD' }
            $commits = git log --no-merges --format='- %s (%h)' $range
            $since = if ($last) { " since $last" } else { '' }
            Set-Content -Path "$env:RUNNER_TEMP/changes.md" -Value (@("Nightly build of master at $($env:GITHUB_SHA.Substring(0, 7)): untested, may be broken.", '', "## Changes$since", '') + $commits) -Encoding utf8
            "version=$v" >> $env:GITHUB_OUTPUT
            "nightly=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $v = $env:INPUT_VERSION.Trim().TrimStart('v')
          if (-not $v) { $v = "0.0.$env:RUN_NUMBER" }
          if ($v -notmatch '^[0-9A-Za-z.\-]+$') { throw "bad version '$v'" }
          if (git tag -l "v$v") { throw "tag v$v already exists" }
          # The version's CHANGELOG.md section (from its "## v<version>" heading to the next "## "): required.
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::IndexOf($lines, "## v$v")
          if ($start -lt 0) { throw "CHANGELOG.md has no '## v$v' section" }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $section = if ($end -gt $start + 1) { ($lines[($start + 1)..($end - 1)] -join "`n").Trim() } else { '' }
          if (-not $section) { throw "CHANGELOG.md's '## v$v' section is empty" }
          Set-Content -Path "$env:RUNNER_TEMP/changes.md" -Value "## v$v`n`n$section" -Encoding utf8
          "version=$v" >> $env:GITHUB_OUTPUT
          "nightly=false" >> $env:GITHUB_OUTPUT

      - name: Quick tests
        if: steps.version.outputs.nightly != 'skip'
        run: dotnet test --filter "Category!=Slow&Category!=Bench" -c Release

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.nightly != 'skip'
        with:
          name: changes
          path: ${{ runner.temp }}/changes.md
          if-no-files-found: error

  # One zip per runtime. Unix zips are made on Unix so the execute bits survive; macOS ones on a Mac, which signs the binaries.
  package:
    needs: version
    if: needs.version.outputs.nightly != 'skip'
    strategy:
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Package
        shell: pwsh
        run: ./tools/scripts/package-release.ps1 -Version "${{ needs.version.outputs.version }}" -Rid ${{ matrix.rid }} -Output out -Cache "$env:RUNNER_TEMP/release-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: out/Meitou-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: out

      - uses: actions/download-artifact@v4
        with:
          name: changes
          path: ${{ runner.temp }}

      - name: Tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          NIGHTLY: ${{ needs.version.outputs.nightly }}
        run: |
          $zips = @('win-x64', 'linux-x64', 'osx-x64', 'osx-arm64') | ForEach-Object { "out/Meitou-$env:VERSION-$_.zip" }
          foreach ($zip in $zips) { if (-not (Test-Path $zip)) { throw "$zip missing" } }
          $changes = Get-Content -Raw "$env:RUNNER_TEMP/changes.md"
          $notes = $changes.Trim()
          $flags = @('--latest=false')
          if ($env:PRERELEASE -eq 'true' -or $env:NIGHTLY -eq 'true') { $flags += '--prerelease' }
          # A nightly's notes list every commit already (the version step). A full release adds GitHub's generated notes (merged pull requests),
          # from the previous full release, not a launcher-v* tag in between (docs/launcher.md), so they span its nightlies.
          if ($env:NIGHTLY -ne 'true') {
            $flags += '--generate-notes'
            $previous = git tag -l "v[0-9]*" --sort=-v:refname | Where-Object { $_ -notmatch '-nightly\.' } | Select-Object -First 1
            if ($previous) { $flags += @('--notes-start-tag', $previous) }
          }
          gh release create "v$env:VERSION" @zips --target $env:GITHUB_SHA `
            --title "Meitou $env:VERSION" --notes $notes @flags

      # Only the newest 7 nightlies are kept, so the releases page and the launcher's Versions list stay short.
      - name: Prune old nightlies
        if: needs.version.outputs.nightly == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = gh release list --limit 200 --json tagName,createdAt | ConvertFrom-Json |
            Where-Object { $_.tagName -match '^v.*-nightly\.' } | Sort-Object createdAt -Descending | Select-Object -Skip 7
          foreach ($r in $old) { gh release delete $r.tagName --cleanup-tag --yes }

      # Posts a nightly's commit list to Discord as an embed linking the release; skipped without the DISCORD_WEBHOOK_URL secret.
      - name: Announce on Discord
        if: needs.version.outputs.nightly == 'true'
        shell: pwsh
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if (-not $env:WEBHOOK) { 'No DISCORD_WEBHOOK_URL secret; not announced.' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/v$env:VERSION"
          $commits = @(Get-Content "$env:RUNNER_TEMP/changes.md" | Where-Object { $_.StartsWith('- ') })
          # An embed description holds at most 4096 characters; longer lists end with a count and the release has them all.
          $text = "Untested build of master at $($env:GITHUB_SHA.Substring(0, 7)), may be broken.`n"
          for ($i = 0; $i -lt $commits.Count; $i++) {
            if ($text.Length + $commits[$i].Length -gt 3900) { $text += "`n…and $($commits.Count - $i) more"; break }
            $text += "`n$($commits[$i])"
          }
          $body = @{ embeds = @(@{ title = "Meitou $env:VERSION"; url = $url; description = $text; color = 0xE0A030 }) } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Uri $env:WEBHOOK -Method Post -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
