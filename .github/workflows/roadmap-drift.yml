# Roadmap drift: compares site/src/data/roadmap.ts with GitHub (closed bugs still named, open bugs not named, bug lists out of step,
# an old as-of commit, stale issue forms, play report suggestions) and keeps one "Roadmap out of date" issue. Reports only.
# The Roadmap update workflow starts it after Claude has updated the roadmap, so the issue lists only what Claude left; or by hand.
name: Roadmap drift

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node .github/scripts/roadmap-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTS_URL: ${{ vars.REPORTS_URL }}
