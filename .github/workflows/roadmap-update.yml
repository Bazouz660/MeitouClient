# Roadmap update: after each successful nightly or game release (and on demand), Claude Sonnet 5.5 updates site/src/data/roadmap.ts
# from the commits, issues, drift findings and play reports since the roadmap's as-of commit (.github/scripts/roadmap-update.mjs),
# and the result is committed to master. A push by this workflow starts no other workflow, so it starts the site image itself, then
# the drift check, whose "Roadmap out of date" issue then lists only what Claude left. Needs the ANTHROPIC_API_KEY secret (skipped without it). docs/play-reports.md, "Roadmap updates".
name: Roadmap update

on:
  workflow_run:
    workflows: [Nightly, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: read

concurrency:
  group: roadmap-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci
        working-directory: .github/scripts

      - name: Ask Claude Sonnet 5.5 for edits
        id: update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTS_URL: ${{ vars.REPORTS_URL }}
          SUMMARY_FILE: ${{ runner.temp }}/roadmap-update.md
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret; skipped." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          node .github/scripts/roadmap-update.mjs
          if git diff --quiet; then
            echo "Nothing to change." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The page must still build with the edits; a failure here leaves master untouched.
      - name: Build the site
        if: steps.update.outputs.changed == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Commit to master
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Roadmap updated by Claude Sonnet 5.5 after $(git rev-parse --short=8 HEAD)"
          for i in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 10
          done
          exit 1

      - name: Rebuild the site
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run site-image.yml --ref master

      # After every run that asked Claude, changed or not: the issue then holds only what is still off.
      - name: Run the drift check on the result
        if: steps.update.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run roadmap-drift.yml --ref master
